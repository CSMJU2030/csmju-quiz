# ทดสอบ image แบบเดียวกับ server ก่อนเปิด PR (standards 1.8 deployment.md ข้อ 6) — service db · api · web
# api และ web ล็อกแบบ server (read_only · cap_drop · no-new-privileges · mem_limit · หมุน log)
#   cp backend/.env.example backend/.env   (แก้ค่า และตั้ง POSTGRES_PASSWORD ใน .env ที่ราก)
#   docker compose up -d --build
# ทางหลักตาม LOCAL_INTEGRATION_GUIDE คือใช้ PostgreSQL ตัวเดียวกับ Core Hub ที่ :5432
#   แล้วสร้างฐานข้อมูล quiz_db แยก — กรณีนั้นรันแค่ backend/frontend ด้วย pnpm ก็พอ
# db ในไฟล์นี้เปิดที่ host :5434 เพื่อไม่ชนกับ PostgreSQL ตัวหลักที่ :5432
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quiz_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env ที่ราก repo}
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d quiz_db"]
      interval: 5s
      retries: 10

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/quiz_db
      NODE_ENV: production
      PORT: 4000
      DATABASE_POOL_MAX: 5
      TZ: Asia/Bangkok
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # web เป็นทางเข้าเดียว — ส่ง /api/* และ /auth/* ต่อไป api ในเครือข่ายของ compose
        BACKEND_URL: http://api:4000
        NEXT_PUBLIC_CORE_HUB_WEB_URL: ${NEXT_PUBLIC_CORE_HUB_WEB_URL:-https://csmju2030.jowave.com}
    environment:
      TZ: Asia/Bangkok
    tmpfs: ["/tmp:size=32m", "/app/frontend/.next/cache:size=64m"]
    mem_limit: 384m
    # พอร์ต frontend ของทีม — callback ที่ลงทะเบียนไว้ http://localhost:3102/auth/callback ยังใช้ได้
    ports:
      - "127.0.0.1:3102:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
